# Kyle-Back market started from a prior: V ~ N(0, Sigma0) is drawn once at time 0-, the insider sees it at
# once (the initial shock's loading 1 on its row), the market maker starts from the prior variance (no
# loading on its row); the game ends at T (continuation: end).  Trader: maximise E int [D (V - P) -
# eps D^2] dt; market maker: P = E[V | flow history] (myopic, competitive).  The price is a martingale with
# a constant impact: the market maker's map is the constant lambda on every node of the strip (spread 7e-7
# at eps 0.2), so lambda^2 sigma_Z^2 T = Sigma0 - Sigma_T, Sigma_T the market maker's belief error of V at
# T (res.belief_error), must hold at every eps and does: 0.614143 against 0.614142 at eps 0.2, 0.658872
# against 0.658865 at 0.1 (12 nodes; tests/test_transition_examples.py).  Back (1992), eps = 0 and the
# value revealed by T, has lambda = sqrt(Sigma0 / T) / sigma_Z = 0.7071 here (sqrt(Sigma0) / sigma_Z only
# at T = 1), and a sweep over eps converges to it (0.697 at eps 0.02; eps 0.05 and below converge only
# warm-started from the previous point, see the README).  lambda(0+) is res.maps["market_maker"][0, 0] at
# the node t = 0, age 0.  The trader's second-order check reports NOT A MINIMUM (-0.010 at eps 0.1, 12
# nodes, relative to the form's largest curvature): the strip quadrature's error on the D P cross term along
# the line s = 0 at a small trading cost, present with or without the prior, gone at eps 1 (README,
# Transitions and Limits).
#   noisestate solve examples/kyle_back_prior.yaml --plot prior.png
name: kyle_back_prior
params: {eps: 0.1, Sigma0: 1.0, sigma_Z: 1.0}
channels: [wZ]
states:
  V: {drift: {}, noise: {}}           # the value: constant, drawn at time 0- (the initial shock below)
agents:
  market_maker:
    controls: [P]
    myopic: true
    signals:
      flow: {drift: {D1: 1.0}, noise: {wZ: sigma_Z}}
    loss: [[1.0, P, P], [-2.0, P, V]]
  trader1:
    controls: [D1]
    signals:
      flow: {drift: {}, noise: {wZ: sigma_Z}}     # the order flow net of its own orders; V(0) is seen on it at once
    loss: [[-1.0, D1, V], [1.0, D1, P], [eps, D1, D1]]
horizon:
  kind: transition
  window: 2.0
  nodes: 12
  discount: 0.0
  past:
    initial:
      - {name: v0, loads: {V: "sqrt(Sigma0)"}, rows: {trader1.flow: 1.0}}
  continuation: end
