# Chapter 3 tracking game, a change of regime: player1's signal precision rises from 3 (the stationary
# example ch3_two_player.yaml, the past) to 10 at time zero.  The transition is solved on [0, 6] from the old
# stationary equilibrium (its kernels on the shocks born before zero stay alive on a band until age L = 3)
# and continued by the new model's stationary equilibrium, at which every map is frozen on a buffer [6, 9]:
# res.loss_path is E[loss(t)], res.excess_costs the discounted cost of the transition over the new stationary
# flow, res.settled how far the maps on [3, 6] are from the new stationary ones.  At this size the summary
# raises three flags, each expected: TRANSITION NOT SETTLED (4.8e-4 against settled_tol 1e-4: T = 6 is
# short for a closed-loop decay of 1e-2 per unit of t; 2.7e-6 at T = 9, raise horizon.window to quiet it),
# UNDER-RESOLVED (representation error 8.6e-4, all of it on the band's collapsing tip, where the old shocks'
# kernels are cut at age L: geometry, not the interior's resolution, which sits at 4e-5; see
# res.representation_parts) and PAST WINDOW TOO SHORT (the old regime's kernels still move by 2.4% of their
# peak over the last tenth of its window L = 3, the shipped ch3_two_player.yaml's: solve the past with a
# longer window for a sharper band).
#   noisestate solve examples/ch3_precision_change.yaml --plot change.png
name: ch3_precision_change
params: {p1: 10.0, p2: 10.0, r1: 1.0, r2: 1.0}
shocks: [w0, w1, w2]
states:
  X: (D1 + D2) dt + dw0
agents:
  player1:
    controls: D1
    observes:
      y1: sqrt(p1) X dt + dw1
    loss: 0.5 X^2 + 0.5 r1 D1^2
  player2:
    controls: D2
    observes:
      y2: sqrt(p2) X dt + dw2
    loss: 0.5 X^2 + 0.5 r2 D2^2
horizon:
  kind: transition
  discount: 0.0
  T: 6.0
  past:
    model: ch3_two_player.yaml
  continuation: stationary
numerics: {nodes: 12, continuation_nodes: 12}
