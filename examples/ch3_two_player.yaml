# Chapter 3 benchmark: stationary two-player tracking game, average cost.
#   dX = (D1 + D2) dt + dW0,   dY_i = sqrt(p_i) X dt + dW_i,
#   player i minimises E[ 1/2 X^2 + 1/2 r_i D_i^2 ]  (average cost, rho = 0)
name: ch3_two_player
params: {p1: 3.0, p2: 10.0, r1: 1.0, r2: 1.0}
shocks: [w0, w1, w2]
states:
  X: (D1 + D2) dt + dw0
agents:
  player1:
    controls: D1
    observes:
      y1: sqrt(p1) X dt + dw1
    loss: 0.5 X^2 + 0.5 r1 D1^2
  player2:
    controls: D2
    observes:
      y2: sqrt(p2) X dt + dw2
    loss: 0.5 X^2 + 0.5 r2 D2^2
horizon: {window: 3.0}
numerics: {nodes: 24}
