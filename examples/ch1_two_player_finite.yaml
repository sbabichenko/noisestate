# Chapter 1 finite-horizon two-player tracking game (variance part).
#   dX = (D1 + D2) dt + sigma dW0,  dY_i = sqrt(p_i) X dt + dW_i,
#   player i minimises E int_0^T (X^2 + r_i D_i^2) dt.
name: ch1_two_player_finite
params: {p1: 3.0, p2: 3.0, r1: 0.1, r2: 0.1, sigma: 1.0}
shocks: [w0, w1, w2]
states:
  X: (D1 + D2) dt + sigma dw0
agents:
  player1:
    controls: D1
    observes:
      y1: sqrt(p1) X dt + dw1
    loss: X^2 + r1 D1^2
  player2:
    controls: D2
    observes:
      y2: sqrt(p2) X dt + dw2
    loss: X^2 + r2 D2^2
horizon: {T: 1.0}
numerics: {nodes: 12}
