name: ch5_cycle_market
params: {theta: 4.0, xi: 0.15, zeta: 0.5, kappa: 0.3, m: 1.0, r: 0.2, rP: 0.0, c: 0.2, sigma_u: 1.0, theta_a: 0.5,
  sigma_a: 1.0, theta_eta: 0.5, sigma_eta: 1.0, s1: 2.5, s2: 0.3, s3: 0.3, s4: 2.0, tau: 0.5}
shocks: [w_q, w_a0, w_eta0, w_0_0, w_0_1, w_0_2, w_0_3, w_a1, w_eta1, w_1_0, w_1_1, w_1_2, w_1_3, w_a2, w_eta2,
  w_2_0, w_2_1, w_2_2, w_2_3]
states:
  q: sigma_u dw_q
  a0: -theta_a a0 dt + sigma_a dw_a0
  eta0: -theta_eta eta0 dt + sigma_eta dw_eta0
  a1: -theta_a a1 dt + sigma_a dw_a1
  eta1: -theta_eta eta1 dt + sigma_eta dw_eta1
  a2: -theta_a a2 dt + sigma_a dw_a2
  eta2: -theta_eta eta2 dt + sigma_eta dw_eta2
definitions:
  yH0: q + (theta - 1) Pidx - theta pi0 + eta0
  Pidx: 0.3333333333333333 P0@tau + 0.3333333333333333 P1@tau + 0.3333333333333333 P2@tau
  pi0: P0@tau
  dev0: pi0 - (1 - xi - zeta) Pidx - xi q - zeta pi2 + zeta a0@tau
  pi2: P2@tau
  d0: o1@tau
  mis0: a0@tau + i0 - d0 - yH0
  i0: o0@tau
  quote_gap0: P0 - Pnext
  Pnext: 0.3333333333333333 P0 + 0.3333333333333333 P1 + 0.3333333333333333 P2
  bill0: P2 - Pnext
  yH1: q + (theta - 1) Pidx - theta pi1 + eta1
  pi1: P1@tau
  dev1: pi1 - (1 - xi - zeta) Pidx - xi q - zeta pi0 + zeta a1@tau
  d1: o2@tau
  mis1: a1@tau + i1 - d1 - yH1
  i1: o1@tau
  quote_gap1: P1 - Pnext
  bill1: P0 - Pnext
  yH2: q + (theta - 1) Pidx - theta pi2 + eta2
  dev2: pi2 - (1 - xi - zeta) Pidx - xi q - zeta pi1 + zeta a2@tau
  d2: o0@tau
  mis2: a2@tau + i2 - d2 - yH2
  i2: o2@tau
  quote_gap2: P2 - Pnext
  bill2: P1 - Pnext
agents:
  firm0:
    controls: [P0, o0]
    observes:
      sales: yH0 dt + s1 dw_0_0
      trans_price: P2 dt + s2 dw_0_1
      order_book: o1 dt + s3 dw_0_2
      upstream_order: o2 dt + s4 dw_0_3
      own_prod: dw_a0
    loss: dev0^2 - 2 kappa d0 - 2 kappa yH0 + m mis0^2 + r o0^2 + rP quote_gap0^2 + 2 c o0 bill0
  firm1:
    controls: [P1, o1]
    observes:
      sales: yH1 dt + s1 dw_1_0
      trans_price: P0 dt + s2 dw_1_1
      order_book: o2 dt + s3 dw_1_2
      upstream_order: o0 dt + s4 dw_1_3
      own_prod: dw_a1
    loss: dev1^2 - 2 kappa d1 - 2 kappa yH1 + m mis1^2 + r o1^2 + rP quote_gap1^2 + 2 c o1 bill1
  firm2:
    controls: [P2, o2]
    observes:
      sales: yH2 dt + s1 dw_2_0
      trans_price: P1 dt + s2 dw_2_1
      order_book: o0 dt + s3 dw_2_2
      upstream_order: o1 dt + s4 dw_2_3
      own_prod: dw_a2
    loss: dev2^2 - 2 kappa d2 - 2 kappa yH2 + m mis2^2 + r o2^2 + rP quote_gap2^2 + 2 c o2 bill2
horizon: {window: 24.0}
ties:
- [firm0, firm1, firm2]
numerics: {nodes: 8, unit: 0.5, unit_range: 8.0}
