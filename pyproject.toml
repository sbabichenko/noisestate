[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noisestate"
version = "0.2.0"
description = "Equilibrium solver for linear-quadratic-Gaussian games with private information (noise-state linear strategies)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pyyaml>=6", "matplotlib>=3.6"]

[project.optional-dependencies]
dev = ["pytest>=7", "pyflakes>=3"]

[project.scripts]
noisestate = "noisestate.cli:main"

[tool.setuptools]
packages = ["noisestate"]
