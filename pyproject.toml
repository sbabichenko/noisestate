[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noisestate"
version = "1.0.0"
description = "Equilibrium solver for linear-quadratic-Gaussian games with private information (noise-state linear strategies)"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Sam Babichenko", email = "sbabichenko@ucsb.edu"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.13", "pyyaml>=6"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/sbabichenko/noisestate"
Repository = "https://github.com/sbabichenko/noisestate"
Changelog = "https://github.com/sbabichenko/noisestate/blob/HEAD/CHANGELOG.md"
Documentation = "https://github.com/sbabichenko/noisestate/blob/HEAD/docs/README.md"

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
dev = ["pytest>=7", "pyflakes>=3", "matplotlib>=3.6"]

[project.scripts]
noisestate = "noisestate.cli:main"

[tool.setuptools]
packages = ["noisestate", "noisestate.examples"]

#  The shipped model files install as noisestate/examples/ while staying at the top level of the
#  repository: package-dir maps the one directory to the other, so examples/ch4_kyle_back.yaml is
#  the same file for a reader of the checkout and for ns.example() on an installed wheel.  Before
#  this the first line of the README could not run after a pip install.
[tool.setuptools.package-dir]
"noisestate.examples" = "examples"

[tool.setuptools.package-data]
"noisestate.examples" = ["*.yaml"]

[tool.pytest.ini_options]
# A deprecation is an error in this suite: the spellings deprecated in 0.5 were still used by 55 test
# sites when 0.6 removed them, because nothing ever read the warnings.  The filter is not qualified by
# module: warnings.warn(stacklevel=2) attributes the warning to the caller, so "…:noisestate.*" matches
# the test that made the call, never the package, and fires on nothing (checked, not assumed).  A
# third-party deprecation we cannot fix gets its own ignore line here.
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
]
